name: CI

on:
  workflow_dispatch:
    inputs:
      windows_probe_only:
        description: Run the bounded Windows ACL environment diagnostic only
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.windows_probe_only }}
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: node tests/validate-plugin.mjs

  ux-portability:
    name: Full validation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_probe_only && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - if: runner.os == 'Windows'
        run: node tests/windows-acl-probe.mjs
      - if: ${{ !inputs.windows_probe_only }}
        run: npm run validate
