name: CI

on:
  workflow_dispatch:
    inputs:
      windows_probe_only:
        description: Run the bounded Windows privacy and native utility preflight only
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.windows_probe_only }}
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: node tests/validate-plugin.mjs

  ux-portability:
    name: ${{ inputs.windows_probe_only && 'Windows preflight' || format('Full validation on {0}', matrix.os) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_probe_only && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - if: runner.os == 'Windows'
        run: |
          node tests/run-synthetic.mjs tests/acl-startup-diagnostic.test.mjs
          node tests/run-synthetic.mjs tests/private-path.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-name-pattern "native mock forwards|native Windows process inspection" tests/windows-provider.test.mjs
      - if: ${{ !inputs.windows_probe_only }}
        run: npm run validate
